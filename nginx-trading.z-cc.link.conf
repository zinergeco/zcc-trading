# /etc/nginx/conf.d/trading.z-cc.link.conf
# Same pattern as zcc.conf: system nginx → fixed Coolify host port.
# Set HOST_PORT to the host port you map in Coolify (App → Network → Port mapping HOST_PORT:3000).
server {
    listen 80;
    server_name trading.z-cc.link;
    location / {
        proxy_pass http://localhost:3008;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
# Then: certbot --nginx -d trading.z-cc.link   (adds the 443 block + redirect)
